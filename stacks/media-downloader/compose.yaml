x-logging: &a2
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
x-common-env: &a1
  PUID: "1000"
  PGID: "1000"
  TZ: Europe/Berlin
services:
  gluetun:
    image: qmcgaw/gluetun@sha256:3c43ec327d7ab2b5f1dc798b92a7640de9a1e1b74a81c9a5143adb383c03d28b
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - ${HOST_IP:-192.168.10.2}:8888:8888/tcp
      - ${HOST_IP:-192.168.10.2}:8388:8388/tcp
      - ${HOST_IP:-192.168.10.2}:8388:8388/udp
      - ${HOST_IP:-192.168.10.2}:8080:8080
      - ${HOST_IP:-192.168.10.2}:9696:9696
      - ${HOST_IP:-192.168.10.2}:8989:8989
      - ${HOST_IP:-192.168.10.2}:7878:7878
      - ${HOST_IP:-192.168.10.2}:8686:8686
    environment:
      <<: *a1
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:?set WIREGUARD_PRIVATE_KEY in .env}
      SERVER_COUNTRIES: Switzerland
      UPDATER_PERIOD: 24h
      HTTPPROXY: on
      HTTPPROXY_USER: ${HTTPPROXY_USER:?set HTTPPROXY_USER in .env}
      HTTPPROXY_PASSWORD: ${HTTPPROXY_PASSWORD:?set HTTPPROXY_PASSWORD in .env}
      SHADOWSOCKS: on
      SHADOWSOCKS_PASSWORD: ${SHADOWSOCKS_PASSWORD:?set SHADOWSOCKS_PASSWORD in .env}
    restart: unless-stopped
    logging: *a2
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls282
    container_name: sabnzbd
    environment:
      <<: *a1
    volumes:
      - ${APPDATA:-/mnt/pool-01/apps/media-downloader}/sabnzbd/config:/config
      - ${MEDIA:-/mnt/pool-01/media}:/media
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    logging: *a2
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:3.0.2.5780-ls169
    container_name: prowlarr
    environment:
      <<: *a1
    volumes:
      - ${APPDATA:-/mnt/pool-01/apps/media-downloader}/prowlarr/config:/config
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    logging: *a2
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls5
    container_name: sonarr
    environment:
      <<: *a1
    volumes:
      - ${APPDATA:-/mnt/pool-01/apps/media-downloader}/sonarr/config:/config
      - ${MEDIA:-/mnt/pool-01/media}:/media
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    logging: *a2
  radarr:
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328
    container_name: radarr
    environment:
      <<: *a1
    volumes:
      - ${APPDATA:-/mnt/pool-01/apps/media-downloader}/radarr/config:/config
      - ${MEDIA:-/mnt/pool-01/media}:/media
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    logging: *a2
  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.6.5079-ls49
    container_name: lidarr
    environment:
      <<: *a1
    volumes:
      - ${APPDATA:-/mnt/pool-01/apps/media-downloader}/lidarr/config:/config
      - ${MEDIA:-/mnt/pool-01/media}:/media
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    logging: *a2
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HTML: ${LOG_HTML:-false}
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-none}
      TZ: Europe/Berlin
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    logging: *a2
networks: {}
